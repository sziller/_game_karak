[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karak-game"
version = "0.1.0"
description = "Karak browser game and game engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "PyYAML",
    "jinja2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "karak_shmc*", "shmc_routers*"]

[tool.setuptools.package-data]
"app" = [
    "templates/*.html",
    "static/**/*",
    "content/**/*",
]
