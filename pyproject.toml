[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karak-game"
version = "0.0.3"
description = "Karak browser game and game engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "python-jose",
    "uvicorn",
    "pydantic",
    "PyYAML",
    "jinja2",
]

[project.optional-dependencies]
shmc = ["shmc-auth-client==0.1.0"]
build = ["build", "wheel"]
test = ["pytest", "httpx"]

[project.scripts]
karak-server = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "karak_shmc*", "shmc_routers*"]

[tool.setuptools]
py-modules = ["RUN_API_karak"]

[tool.setuptools.package-data]
"app" = [
    "templates/*.html",
    "static/favicon.ico",
    "static/css/*.css",
    "static/js/*.js",
    "static/media/hero-boards/*.png",
    "static/media/tile-content/*.png",
    "static/media/tiles/*.png",
    "content/base/*.yaml",
    "content/dragonfall_escape/*.yaml",
]

[tool.setuptools.data-files]
"share/karak-game/config" = [
    "config/karak.example.env",
    "config/profiles/local-pc.example.env",
    "config/profiles/trusted-lan.example.env",
    "config/profiles/media-center.example.env",
    "config/profiles/central-hosted.example.env",
]
"share/karak-game/deploy/examples" = [
    "deploy/examples/karak@.service",
    "deploy/examples/nginx-dedicated-host.conf",
    "deploy/examples/nginx-mounted-prefix.conf",
]
"share/karak-game/docs" = [
    "docs/portable_deployment_configuration.adoc",
    "docs/central_hosted_deployment.adoc",
    "docs/trusted_lan_hosting.adoc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app/domain"]

