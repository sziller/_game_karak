<head>
    <meta charset="UTF-8">
    <title>Karak - Lobby</title>
    <link href="{{ karak_static_url }}/favicon.ico" rel="icon">
    <link href="{{ karak_static_url }}/css/phase2_lobby.css" rel="stylesheet">
</head>
<body class="karak-page lobby-page">
<div class="lobby-shell">

    <div class="lobby-header">
        <div class="lobby-title">Karak - Lobby</div>
        <div class="lobby-session" id="lobby-session-label"></div>
    </div>

    <div class="lobby-main">

        <section class="ui-panel lobby-left-panel">
            <div class="lobby-section-title">Players</div>

            <div class="lobby-player-setup-column">
                <div class="player-add-row">
                    <input id="player-name-input" placeholder="Player name">
                    <button id="add-player-btn">Add player</button>
                </div>

                <div class="lobby-player-list" id="lobby-player-list"></div>
            </div>

            <div class="lobby-class-column">
                <div class="lobby-class-card" id="lobby-class-card">
                    <div class="muted">Select a player, then assign a profession.</div>
                </div>
            </div>
        </section>

        <section class="ui-panel lobby-right-panel">
            <div class="lobby-section-title">Game rules</div>

            <div class="config-editor" id="config-editor"></div>
        </section>

    </div>

    <div class="lobby-footer">
        <button id="back-to-phase1-btn">Back</button>
        <div class="message-box message-info" id="message-box">
            <b id="message-title">Info</b>
            <pre id="message-content">(ready)</pre>
        </div>
        <button disabled id="start-game-btn">Start game</button>
    </div>

</div>

<script>
    window.KARAK_BASE_URL = "{{ karak_base_url }}";
    window.KARAK_STATIC_URL = "{{ karak_static_url }}";
</script>
<script src="{{ karak_static_url }}/js/phase2_lobby.js"></script>
</body>
