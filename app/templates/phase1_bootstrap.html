<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Karak - Game style selection</title>
    <link rel="icon" href="{{ karak_static_url }}/favicon.ico">
    <link href="{{ karak_static_url }}/css/phases12.css?v={{ karak_asset_version }}" rel="stylesheet">
</head>
<body>

<h1>Karak - Game style selection</h1>
<p>Bootstrap / session start</p>
{% if karak_dev_auth_helper_enabled %}
<p><a href="{{ karak_base_url }}/login">Developer auth helper</a></p>
{% endif %}

<div class="panel">
    <h2>Local</h2>
    <button onclick="startHotseat()">Start Hot-seat</button>
</div>

<div class="panel">
    <h2>Host</h2>
    <input id="host-name" placeholder="Host name" type="text" value="Host">
    <button id="host-submit-btn" onclick="startHost()">Create Multiplayer Lobby</button>
</div>

<div class="panel">
    <h2>Join</h2>
    <input id="join-name" placeholder="Player name" type="text" value="Guest">
    <input id="join-room" placeholder="Room code" type="text" value="">
    <button id="join-submit-btn" onclick="joinHost()">Join Multiplayer Lobby</button>
</div>

<div class="message-box message-info" id="message-box">
    <b id="message-title">Info</b>
    <pre id="message-content">(ready)</pre>
</div>

<script>
    window.KARAK_BASE_URL = "{{ karak_base_url }}";
    window.KARAK_STATIC_URL = "{{ karak_static_url }}";
    window.KARAK_ADVERTISED_ORIGIN = "{{ karak_advertised_origin }}";
    window.KARAK_DEPLOYMENT_MODE = "{{ karak_deployment_mode }}";
    {% if karak_local_dev_jwt %}
    window.KARAK_LOCAL_DEV_JWT = "{{ karak_local_dev_jwt }}";
    {% endif %}
</script>
{% if karak_include_shmc_auth_script %}
<script src="/js/shmc_auth.js"></script>
{% endif %}
<script src="{{ karak_static_url }}/js/karak_game_context.js?v={{ karak_asset_version }}"></script>
<script src="{{ karak_static_url }}/js/karak_auth.js?v={{ karak_asset_version }}"></script>
<script src="{{ karak_static_url }}/js/phase1_bootstrap.js?v={{ karak_asset_version }}"></script>

</body>
</html>
