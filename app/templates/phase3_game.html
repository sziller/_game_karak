<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Karak - Arena</title>
    <link href="{{ karak_static_url }}/favicon.ico" rel="icon">
    <link href="{{ karak_static_url }}/css/phase3_game.css?v={{ karak_asset_version }}" rel="stylesheet">
</head>
<body class="karak-page layout-1920">

<div class="karak-shell">

    <!-- =====================================================
         ROW 1: TOP INFO / GAME STATE
         ===================================================== -->
    <!-- =====================================================
     ROW 1: TOP INFO / GAME STATE
     ===================================================== -->
    <header class="karak-row karak-top-row">

        <!-- LEFT TOP: ENCOUNTER, exactly above PLAYERS -->
        <section class="ui-panel top-entity-panel" id="entity-choice-panel">
            <div class="panel-title">Encounter</div>
            <div class="panel-placeholder" id="entity-choice-box">
                No encounter display yet.
            </div>
        </section>

        <!-- CENTER TOP: GAME STATE, exactly above MAP -->
        <section class="ui-panel top-mapstate-panel">

            <div class="action-counter-box" id="action-counter-box">
                <div class="action-counter-title">Actions</div>
                <div class="action-counter-value" id="action-counter-value">- / -</div>
            </div>

            <div class="room-x-counter-box" id="room-x-counter-box">
                <div class="room-x-counter-title">RED rooms</div>
                <div class="room-x-counter-value" id="room-x-counter-value">0</div>
            </div>

            <div class="curse-toss-box" id="curse-toss-box">
                <div class="curse-toss-title">Manual toss</div>
                <div class="curse-toss-die" id="curse-toss-die">-</div>
            </div>

        </section>

        <!-- RIGHT TOP: GROUND ITEM, exactly above ACTIVE INVENTORY -->
        <section class="ui-panel top-ground-panel">
            <div class="ground-box" id="ground-box">
                <div class="ground-title">Ground</div>
                <div class="ground-slot">
                    <div class="ground-image">
                        <span class="muted">(loading)</span>
                    </div>
                    <div class="ground-id">-</div>
                </div>
            </div>
        </section>

    </header>


    <!-- =====================================================
         ROW 2: MAIN GAME VIEW
         ===================================================== -->
    <main class="karak-row karak-main-row">

        <!-- PLAYERS / FULL DISCLOSURE AREA -->
        <section class="ui-panel players-panel">
            <div class="panel-title">Players</div>

            <!-- JS currently renders full player rows here.
                 Later: add compact read-only inventory display per player here. -->
            <div class="players-box" id="players-box">(loading)</div>

            <!-- These are selection-state boxes.
                 Keep them present; CSS will reserve stable space. -->
            <div class="selection-box" id="curse-confirm-box"></div>
            <div class="selection-box" id="poison-confirm-box"></div>
            <div class="selection-box" id="teleport-confirm-box"></div>
        </section>


        <!-- MAP -->
        <section class="ui-panel map-panel">
            <div class="image map-frame" id="map">
                <button
                        class="map-pan-btn map-pan-up"
                        onclick="panMapViewport('up')"
                        title="Move map up"
                        type="button"
                >▲
                </button>

                <button
                        class="map-pan-btn map-pan-right"
                        onclick="panMapViewport('right')"
                        title="Move map right"
                        type="button"
                >▶
                </button>

                <button
                        class="map-pan-btn map-pan-down"
                        onclick="panMapViewport('down')"
                        title="Move map down"
                        type="button"
                >▼
                </button>

                <button
                        class="map-pan-btn map-pan-left"
                        onclick="panMapViewport('left')"
                        title="Move map left"
                        type="button"
                >◀
                </button>

                <button
                        class="map-pan-btn map-pan-center"
                        onclick="centerMapOnActivePlayerAndRender()"
                        title="Center on active player"
                        type="button"
                >◎
                </button>

                <div id="mapCanvas"></div>
            </div>
        </section>


        <!-- ACTIVE PLAYER INVENTORY -->
        <section class="ui-panel inventory-panel">
            <div class="panel-title">Active inventory</div>
            <div class="inventory-box" id="inventory-box">(loading)</div>
        </section>

    </main>


    <!-- =====================================================
         ROW 3: CONTROLS / TARGETING / MESSAGES
         ===================================================== -->
    <footer class="karak-row karak-bottom-row">

        <!-- TARGETING / TELEPORT -->
        <section class="ui-panel targeting-panel" id="teleport-box">
            <div class="panel-title">Targeting / Teleport</div>

            <div class="targeting-mode-label" id="teleport-mode-label">
                Portal teleport
            </div>

            <div class="teleport-inputs">
                <label class="visually-hidden" for="teleport-x">Teleport X</label>
                <input id="teleport-x" placeholder="x" type="number">

                <label class="visually-hidden" for="teleport-y">Teleport Y</label>
                <input id="teleport-y" placeholder="y" type="number">
            </div>

            <div class="teleport-buttons">
                <button disabled id="teleport-cancel-btn" onclick="cancelTeleportTargeting()">Cancel</button>
                <button id="teleport-btn" onclick="confirmTeleport()">🚀 Teleport</button>

            </div>
        </section>


        <!-- NAVIGATION / TURN ACTIONS -->
        <section class="ui-panel navigation-panel">
            <div class="panel-title">Navigation / Turn</div>

            <div class="bottom-controls-layout">

                <div class="move-grid">
                    <div></div>
                    <button id="move-n-btn" onclick="move('N')">⬆️</button>
                    <div></div>

                    <button id="move-w-btn" onclick="move('W')">⬅️</button>
                    <button id="confirm-tile-btn" onclick="confirmTile()">✅</button>
                    <button id="move-e-btn" onclick="move('E')">➡️</button>

                    <button id="rotate-left-btn" onclick="rotateTile('left')">⟲</button>
                    <button id="move-s-btn" onclick="move('S')">⬇️</button>
                    <button id="rotate-right-btn" onclick="rotateTile('right')">⟳</button>
                </div>

                <div class="turn-buttons">
                    <button id="fight-start-btn" onclick="fightStart()">⚔️ Start Fight</button>
                    <button id="end-turn-btn" onclick="endTurn()">End Turn</button>
                </div>

            </div>
        </section>


        <!-- MESSAGE / SYSTEM -->
        <section class="ui-panel message-panel">
            <div class="message-box message-info" id="message-box">
                <b id="message-title">Info</b>
                <pre id="message-content">(ready)</pre>
            </div>
        </section>

    </footer>

</div>


<!-- =========================================================
     FIGHT MODAL
     ========================================================= -->
<div class="modal-overlay hidden" id="fight-modal">
    <div class="modal-window">
        <div class="modal-header">
            <h2>Fight</h2>
            <button onclick="closeFightModal()">✖</button>
        </div>

        <div class="fight-modal-actions">
            <button onclick="fightToss()">🎲 Toss</button>
            <button onclick="fightResolve()">✅ Resolve</button>
            <button onclick="fightRefresh()">🔄 Refresh Fight</button>
        </div>

        <div id="fight-box">(no active fight)</div>
    </div>
</div>


<script>
    window.KARAK_BASE_URL = "{{ karak_base_url }}";
    window.KARAK_STATIC_URL = "{{ karak_static_url }}";
    window.KARAK_ADVERTISED_ORIGIN = "{{ karak_advertised_origin }}";
    window.KARAK_DEPLOYMENT_MODE = "{{ karak_deployment_mode }}";
    {% if karak_local_dev_jwt %}
    window.KARAK_LOCAL_DEV_JWT = "{{ karak_local_dev_jwt }}";
    {% endif %}
</script>
{% if karak_include_shmc_auth_script %}
<script src="/js/shmc_auth.js"></script>
{% endif %}
<script src="{{ karak_static_url }}/js/karak_game_context.js?v={{ karak_asset_version }}"></script>
<script src="{{ karak_static_url }}/js/karak_auth.js?v={{ karak_asset_version }}"></script>
<script src="{{ karak_static_url }}/js/phase3_game.js?v={{ karak_asset_version }}"></script>

</body>
</html>
